server {
    listen 80;
    root /usr/share/nginx/html;

    # Scan progress (Server-Sent Events): don't buffer, and allow long quiet gaps.
    location /graphql/stream {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /graphql {
        proxy_pass http://bff:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
